name: CI

on:
  push:
    branches: [master, 'change/**']
  pull_request:

jobs:
  commit-kinds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Self-test of the check
        run: bash .github/scripts/check-commit-kinds-test.sh
      - name: Commits do not mix code and infrastructure
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.ref }}" != refs/heads/master ]; then
            range="origin/master..${{ github.sha }}"
          elif [ "${{ github.event.before }}" != 0000000000000000000000000000000000000000 ]; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="${{ github.sha }}^..${{ github.sha }}"
          fi
          bash .github/scripts/check-commit-kinds.sh "$range"

  openspec:
    runs-on: ubuntu-latest
    env:
      OPENSPEC_TELEMETRY: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pinned OpenSpec CLI
        run: |
          pin=$(cat openspec/cli.pin)
          echo "OPENSPEC=npm exec --yes --package=@fission-ai/openspec@$pin -- openspec" >> "$GITHUB_ENV"
          echo "PIN=$pin" >> "$GITHUB_ENV"
      - name: Specs and changes validate strictly
        run: $OPENSPEC validate --all --strict --no-interactive
      - name: Main specs have a real Purpose
        run: |
          if grep -l '^TBD - created by archiving change' openspec/specs/*/spec.md; then
            echo "::error::main specs above still carry the archive's placeholder Purpose; write a real one"; exit 1
          fi
      - name: Active changes have .openspec.yaml
        run: |
          bad=0
          for d in openspec/changes/*/; do
            [ "$d" = openspec/changes/archive/ ] && continue
            [ -f "$d.openspec.yaml" ] || { echo "::error::$d has no .openspec.yaml; create changes with 'openspec new change'"; bad=1; }
          done
          exit $bad
      - name: Skills are generated by the pinned version
        run: |
          bad=0
          for f in .claude/skills/openspec-*/SKILL.md .agents/skills/openspec-*/SKILL.md; do
            v=$(sed -n 's/^ *generatedBy: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' "$f")
            [ "$v" = "$PIN" ] || { echo "::error file=$f::generatedBy '$v' is not openspec/cli.pin '$PIN'; regenerate the skills"; bad=1; }
          done
          exit $bad
      - name: Archived changes have no open agent tasks
        run: |
          if grep -HnE '^\s*- \[ \]' openspec/changes/archive/*/tasks.md | grep -vE '^[^:]+:[0-9]+:\s*- \[ \] ([0-9]+(\.[0-9]+)* )?\[human\]'; then
            echo "::error::archived changes above have unticked tasks that are not [human]"; exit 1
          fi
